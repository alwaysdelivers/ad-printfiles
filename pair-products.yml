name: Pair products (tee <-> hoodie)
on:
  schedule:
    - cron: "17 */6 * * *"     # every 6 hours
  workflow_dispatch:            # run on demand right after adding a prefix
jobs:
  pair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pair tee/hoodie metafields
        run: python pairing/pair_products.py
        env:
          SHOP: rudjph-mx.myshopify.com
          # Reuse the SAME secret names your fulfill-poller uses:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
